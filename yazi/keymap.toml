[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell -- qlmanage -p %s"
desc = "Quick Look"

[[mgr.prepend_keymap]]
on  = "~"
run = "noop"
[[mgr.prepend_keymap]]
on   = "?"
run  = "help"
desc = "Open help"

[[help.prepend_keymap]]
on  = "/"
run = "filter"
desc = "Filter help"

### split-tabs.yazi ###
[[mgr.prepend_keymap]]
on = "\\"
run = "plugin split-tabs spl_toggle"
desc = "Split-tabs: toggle split tabs mode"
[[mgr.prepend_keymap]]
on = "P"
run = "plugin split-tabs spl_preview"
desc = "Split-tabs: toggle preview pane"
