# ref : https://namileriblog.com/terminal/terminal_setting_starship/
# ref : https://tech-unlimited.com/color.html
# symbols : ❰ ❱    

format = """
($hostname )\
($os)\
$directory\
( $git_branch)\
( $git_status)\
( $python)\
( $rust)\
( $time)\
( $cmd_duration)\
\n$character\
"""

add_newline = true
palette = "mypallet"

[fill]
symbol = ' '

[os]
format = "[$symbol]($style)"
style = 'fg:purple bold'
disabled = false
[os.symbols]
Macos = " "  # nf-fa-apple
Ubuntu = " " # nf-linux-ubuntu
Debian = " " # nf-linux-debian
Windows = "󰍲 "

[hostname]
ssh_only = true
style = 'fg:cyan'
ssh_symbol = ' '
format = '[$ssh_symbol$hostname]($style)'
disabled = false

[custom.ssh_os]
when = 'test -n "$SSH_CONNECTION"'
command = '''
case "$(uname -s)" in
  Darwin) printf "" ;;
  Linux)  printf "" ;;
  *)      printf "" ;;
esac
'''
shell = ["sh"]
format = "[$output]($style)"
style = "bold cyan"

[directory]
truncation_length = 100
truncate_to_repo = false
# truncation_symbol = ' ' # nf-fa-folder_open
# home_symbol = ' ~' # nf-fa-home
home_symbol = '~' # nf-fa-home
style = 'fg:pink bold'
read_only = ' 󰌾' # nf-md-lock
read_only_style = 'fg:red bold'
format = '[$path]($style)[$read_only]($read_only_style)'

[git_branch]
symbol = ' ' # nf-fa-github_alt, nf-fa-code_fork
truncation_length = 4
truncation_symbol = ''
style = 'fg:blue'
format = '[$symbol$branch(:$remote_branch)]($style)' # nf-pl-left_soft_divider

[git_status]
style = 'fg:orange'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕'
up_to_date = '✓'
untracked = '?'
# stashed = '$'
modified = '!${count}'
renamed = '»'
deleted = '✘'
format = '([\[$all_status$ahead_behind\]]($style))'

[git_metrics]
added_style = 'fg:matcha_dimmed bold'
deleted_style = 'fg:matcha_dimmed bold'

format = '[+$added/-$deleted]($deleted_style)'
disabled = false

[python]
symbol = '󰌠 '
style = 'fg:yellow bold'
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)'

[rust]
symbol = '󱘗 '
style = 'fg:yellow bold'
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)'

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold green)"
vimcmd_symbol = "[](bold purple)"

[battery]
style = "bold blue"
format = ' ❰ [$symbol$percentage]($style)'
[[battery.display]]
threshold = 100

[cmd_duration]
min_time = 1_000
style = 'fg:orange_dimmed bold'
disabled = false
format = "[ $duration]($style)" # nf-pl-right_soft_divider, nf-mdi-clock

[time]
disabled = false
style = 'fg:foreground_dimmed bold'
format = '[ $time]($style)' # nf-pl-right_soft_divider, nf-fa-clock_o
time_format = '%R' # https://docs.rs/jiff/latest/jiff/fmt/strtime/index.html
utc_time_offset = '+9'
use_12hr = false

[palettes.mypallet]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
blue = "#7aa2f7"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
matcha = "#9ece6a"
magenta="#F872bE"
# dimmed color
foreground_dimmed = "#919294"
comment_dimmed = "#4a567d"
cyan_dimmed = "#5a8e9e"
blue_dimmed = "#4f6ea0"
green_dimmed = "#3b7a51"
orange_dimmed = "#947151"
pink_dimmed = "#9e5f7f"
purple_dimmed = "#7360a0"
red_dimmed = "#9e4c4c"
yellow_dimmed = "#a9b36b"
matcha_dimmed = "#637c50"
magenta_dimmed = "#955c7e"
